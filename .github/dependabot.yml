version: 2
updates:
  # Keep the actions referenced by the workflow and composite action current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      github-actions-patch:
        update-types: [patch]
      github-actions-updates:
        update-types: [minor, major]

  # Keep the Node script dependencies (Anthropic SDK) current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      npm-patch:
        update-types: [patch]
      npm-updates:
        update-types: [minor, major]
